dataset: "MEAD"

path:
  corpus_path: "data/MEAD_corpus"        # per-utterance wavs + transcripts (only for preprocessing from scratch)
  raw_path: "data/MEAD_align"            # staged wavs + .lab files for forced alignment
  preprocessed_path: "data/MEAD"
  lexicon_path: "lexicon/librispeech-lexicon.txt"

preprocessing:
  val_size: 256
  boundary_silence_max_sec: 0.15
  text:
    text_cleaners: ["english_cleaners"]
    language: "en"
  audio:
    sampling_rate: 22050
    max_wav_value: 32768.0
  stft:
    filter_length: 1024
    hop_length: 256
    win_length: 1024
  mel:
    n_mel_channels: 80
    mel_fmin: 0
    mel_fmax: 8000
  pitch:
    feature: "phoneme_level"
    normalization: True
  energy:
    feature: "phoneme_level"
    normalization: True
