path:
  ckpt_path: "./output/ckpt/MEAD_intensity"
  log_path:  "./output/log/MEAD_intensity"
  result_path: "./output/result/MEAD_intensity"

optimizer:
  # The SER feature-matching loss vocodes the batch and runs the SSL
  # forward/backward each step, so this stage needs more memory per sample
  # than backbone training; adjust batch_size to the available hardware.
  batch_size: 8
  betas: [0.9, 0.98]
  eps: 0.000000001
  weight_decay: 0.0
  grad_clip_thresh: 1.0
  grad_acc_step: 1
  warm_up_step: 4000
  anneal_steps: [300000, 400000, 500000]
  anneal_rate: 0.3
  lr_disc: 0.00002
  alpha: 10

step:
  meta_learning_warmup: 9999999
  # Postfilter stage: 20k steps on the frozen backbone, checkpoints every 5k.
  # Select the checkpoint on an evaluation independent of the training loss.
  total_step: 20000
  log_step: 100
  synth_step: 1000
  val_step: 1000
  save_step: 5000
